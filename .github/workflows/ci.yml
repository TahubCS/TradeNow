name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu for CI speed; Windows because the daily routine runs there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Lint
        run: ruff check tradenow tests
      - name: Type check
        run: mypy
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Parse the Task Scheduler script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/schedule-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Try a desktop notification (informational; runners have no visible desktop)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -m tradenow notify-test
