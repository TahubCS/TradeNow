name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu for CI speed; Windows because the daily routine runs there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Lint
        run: ruff check tradenow tests
      - name: Type check
        run: mypy
      - name: Test
        run: python -m unittest discover -s tests -v
