[project]
name = "tradenow"
version = "0.1.0"
description = "Offline gold research with synthetic MGC and historical GLD"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["uvicorn>=0.30,<1"]
# Exact pins so every machine and CI run checks the code the same way.
dev = ["ruff==0.16.9", "mypy==2.3.1"]
# Phase 7 models (ADR-012), pinned exactly so a library update cannot change a result.
ml = ["scikit-learn==1.9.1", "numpy==2.5.3", "scipy==1.18.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradenow"]

[tool.setuptools.package-data]
tradenow = ["dashboard.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the formatter is not enforced yet. B008: default arguments are frozen
# dataclasses, which are safe to share. UP017: timezone.utc is the house style.
ignore = ["E501", "B008", "UP017"]

[tool.mypy]
python_version = "3.13"
files = ["tradenow"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["uvicorn", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
lines-after-imports = 2
