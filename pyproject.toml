[project]
name = "tradenow"
version = "0.1.0"
description = "Offline gold research with synthetic MGC and historical GLD"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["uvicorn>=0.30,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tradenow"]

[tool.setuptools.package-data]
tradenow = ["dashboard.html"]
